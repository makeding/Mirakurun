# logLevel: <number>
logLevel: 2

# path: <string>
path: /var/run/mirakurun.sock

# port: <number>
# You can change this if port conflicted.
# Don't expose this port on the internet, not even with NAPT.
# Use this in LAN or VPN.
# `~` to disable TCP port listening.
port: 40772

# programHistoryRetentionDays: <number>
# Number of days to retain EPG history in SQLite.
programHistoryRetentionDays: 365

# gguideSchedule: <auto|five-field cron|empty string>
# Default auto learns broadcast reception windows, prefers marked daily windows,
# and uses advertised backup windows after a missed or preempted capture.
# Plans and completion records survive restart. Unknown channels are probed once
# per six hours (failed probes retry after one hour). Capture priority stays -1.
# Automatic capture yields to pending EPG gathering and service check/scan jobs,
# including jobs queued after capture starts. Manual Run keeps its explicit behavior.
# An explicit cron overrides automatic timing; an empty string disables it.
# Manual Run in the Jobs schedule always scans the configured terrestrial sources.
# gguideSchedule: auto

# defaultTlvStreamFormat: <ts|tlv>
# Native TLV streams remain TLV unless a client explicitly requests MPEG-TS.
# defaultTlvStreamFormat: tlv

# Per-request TLV protection; omitted values use these defaults (milliseconds).
# tlvStreamProtection:
#   maxBufferBytes: 33554432
#   startupTimeoutMs: 10000
#   sourceTimeoutMs: 30000
#   stallTimeoutMs: 15000
#   outputTimeoutMs: 30000
#   drainTimeoutMs: 10000
